name: Android Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Linux Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex pkg-config

      - name: Install Qt Host (Linux)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'linux'
          target: 'desktop'
          modules: 'qtmultimedia qt3d'

      - name: Install Qt Target (Android)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia qt3d qtwebsockets qtconcurrent qtopengl'

      - name: Build APK
        run: |
          mkdir build && cd build
          
          /home/runner/work/qlcplus/Qt/6.6.0/android_arm64_v8a/bin/qt-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=/home/runner/work/qlcplus/Qt/6.6.0/gcc_64 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            ..
            
          cmake --build . --target apk -j$(nproc)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QLCPlus-Android-APK
          path: build/**/*.apk
