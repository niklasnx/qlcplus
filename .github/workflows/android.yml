name: Android Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex pkg-config

      # The Ubuntu runner already ships an Android SDK and NDK (r27.x). Point
      # Qt at them explicitly so the build is deterministic.
      - name: Print Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Install Qt Host (Linux)
        uses: jurplel/install-qt-action@v4.4.0
        with:
          version: '6.10.2'
          host: 'linux'
          target: 'desktop'
          modules: 'qtmultimedia qt3d'

      - name: Install Qt Target (Android)
        uses: jurplel/install-qt-action@v4.4.0
        with:
          version: '6.10.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia qt3d qtwebsockets'

      - name: Build APK
        run: |
          mkdir build && cd build

          /home/runner/work/qlcplus/Qt/6.10.2/android_arm64_v8a/bin/qt-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=/home/runner/work/qlcplus/Qt/6.10.2/gcc_64 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            ..

          # Build everything first so that the plugin .so files (artnet,
          # e131, loopback, osc, os2l) referenced by the APK exist.
          cmake --build . -j$(nproc)

          # Then package them into the APK.
          cmake --build . --target apk -j$(nproc)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QLCPlus-Android-APK
          path: build/**/*.apk